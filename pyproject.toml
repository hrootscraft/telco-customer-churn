[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnprop"
version = "2.0.0"
description = "Retention propensity, offer targeting under a budget, and production ownership on the IBM Telco churn data."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Rutuja" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "torch>=2.1",
    "shap>=0.44",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "duckdb>=0.10",
    "openpyxl>=3.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[project.scripts]
churnprop = "churnprop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churnprop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end runs that fit the full model zoo"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]
