name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests
        run: python -m pytest -m "not slow"
      - name: End-to-end phase 1 (fast)
        run: python -m pytest -m slow

  airflow-dag:
    # The DAG file must parse on a scheduler that has only Airflow installed (D23).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Airflow (constrained)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "apache-airflow==3.3.2" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.11.txt"
      - name: DagBag test
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: python -m pytest tests/test_dag.py --noconftest -q -p no:cacheprovider
