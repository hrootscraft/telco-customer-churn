# ---------------------------------------------------------------------------
# churnprop default configuration
#
# Every number that shapes the benchmark, the targeting layer, the monitoring
# thresholds or the (later) offer simulation lives here, so a reviewer can see
# the choices in one place and a contributor can run a sensitivity analysis
# without touching code. See docs/DECISIONS.md for why each value was picked.
# ---------------------------------------------------------------------------

seed: 42

data:
  raw_path: data/raw/Telco_customer.xlsx
  id_col: CustomerID
  target: Churn Value
  # Columns that are either identifiers, constant, geographic noise, or
  # *post-outcome* (Churn Label / Score / Reason are recorded after the customer
  # left; CLTV is IBM's own lifetime-value score). None may enter a feature
  # matrix. CLTV is used only in the decision layer, never as a feature.
  leakage_cols:
    - Churn Label
    - Churn Score
    - Churn Reason
    - CLTV
  drop_cols:
    - Count
    - Country
    - State
    - City
    - Zip Code
    - Lat Long
    - Latitude
    - Longitude
  numeric:
    - Tenure Months
    - Monthly Charges
    - Total Charges
  categorical:
    - Gender
    - Senior Citizen
    - Partner
    - Dependents
    - Phone Service
    - Multiple Lines
    - Internet Service
    - Online Security
    - Online Backup
    - Device Protection
    - Tech Support
    - Streaming TV
    - Streaming Movies
    - Contract
    - Paperless Billing
    - Payment Method
  # Engineered on top of the raw columns (see churnprop.features.add_engineered).
  engineered_numeric:
    - n_addon_services
    - avg_monthly_charge
  engineered_categorical:
    - tenure_band

benchmark:
  test_size: 0.2            # stratified hold-out, never touched until the final table
  n_folds: 5
  n_repeats: 2
  # none | smote | class_weight. All three are compared on the same CV folds; this
  # is the regime the hold-out table and the production model use. `none` won:
  # SMOTE costs PR-AUC and calibration on this data (see DECISIONS.md, D3).
  resampling: none
  smote_k_neighbors: 5
  models: [logistic, knn, svm, random_forest, xgboost, lightgbm, ensemble, mlp]
  top_decile: 0.10          # for lift@top-decile
  precision_floor: 0.50     # for recall@precision
  calibration_bins: 10
  fast:                     # overrides for CI / `--fast`
    n_repeats: 1
    n_folds: 3
    n_estimators: 100
    mlp_epochs: 10

stepwise:
  alpha: 0.05               # drop the feature with the largest p-value while max p > alpha
  l1_C: 0.5                 # L1-logistic comparison
  n_permutations: 10        # permutation-importance repeats

explain:
  model: lightgbm           # tree model SHAP is computed on
  segments: [Contract, Internet Service, tenure_band, Payment Method]
  n_customers_waterfall: 3

events:                     # phase 2: synthetic event log behind each real customer (see D9)
  months_after: 7           # months of events past the snapshot for non-churners (covers a 26-week loop)
  signal: 0.15              # multiplies every planted churn effect in the last 3 months (0 = none); see D9
  price_rise_month: -4      # fibre bills rise 5% from this many months before the snapshot

# ---------------------------------------------------------------------------
# Phase 4: the model in production (D19-D24)
# ---------------------------------------------------------------------------
production:
  model: xgboost                      # family from the zoo; trained on snapshot + event features
  model_name: churnprop-propensity    # MLflow registered model
  use_event_features: true
  tracking_uri: sqlite:///mlflow.db   # relative to the repo root; gitignored
  export_dir: models/production       # the promoted model, committed (D19)
  outcome_weeks: 4                    # a batch's labels are available this many weeks later
  gate:
    min_pr_auc_delta: -0.005          # a candidate may not trail production by more than this on the hold-out
    max_ece: 0.05

batches:                              # weekly scoring cohorts simulated from the book (D21)
  n_weeks: 12
  size: 2000                          # bootstrap sample of customers per week
  source: holdout                     # resample only customers the model never trained on (or: all)
  drift:                              # injected so the monitors have something to catch; each names the week it starts
    - from_week: 5
      kind: price_rise
      where: "`Internet Service` == 'Fiber optic'"
      factor: 1.12
      why: "fibre price rise: a covariate shift the model has never seen"
    - from_week: 8
      kind: mix_shift
      where: "`Internet Service` == 'Fiber optic'"
      weight: 1.8
      why: "acquisition mix tilts to fibre: population drift without any row changing"
    - from_week: 7
      kind: label_shift
      where: "`Payment Method` == 'Electronic check' and Contract == 'Month-to-month'"
      flip_to_churn: 0.25
      why: "a competitor campaign: churn rises in a segment with no feature change (concept drift)"

monitoring:                           # thresholds (D22)
  n_bins: 10
  psi_warn: 0.10
  psi_alert: 0.25
  ks_alert: 0.15
  score_psi_alert: 0.10
  ece_alert: 0.05
  churn_rate_rel_alert: 0.10          # observed vs predicted churn rate on matured batches (and z >= 3)
  pr_auc_drop_alert: 0.05             # vs the model card's hold-out PR-AUC
  uplift_gap_alert: 0.04              # realised minus predicted uplift on exploration rows, absolute
  retrain_when: alert                 # any alert recommends a retrain (the DAG's branch)
